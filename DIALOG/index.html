<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Dialog con formulario</title>
</head>
<body>
    <dialog open>
    <form method="dialog">
        <h3>Formulario</h3>

        <label>Nombre:</label>
        <br>
        <input type="text" required>
        <br><br>

        <label>Email:</label>
        <br>
        <input type="email" required>
        <br><br>

        <button type="submit">Enviar y cerrar</button>
        <button type="submit">Cerrar</button>
    </form>
    </dialog>
</body>
</html>
