<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Area</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form class="formulario">
        <h1>Formulario De Contacto</h1>
        <fieldset>
            <legend> INFORMACION BASICA </legend>
            <div> <input type="text" placeholder="Nombre"> </div>
            <div> <input type="text" placeholder="Apellido"> </div>
            <div> <input type="number" placeholder="Edad"> </div>
        </fieldset>
        <fieldset>
            <legend>INFORMACION DE CONTACTO</legend>
            <div> <input type="text" placeholder= "Email"></div>
            <div> <textarea rows="5" placeholder="Ingrese un Mensaje"></textarea></div>
        </fieldset>
    </form>
</body>
</html>
