<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejemplo datalist</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<h2>Elegí una fruta</h2>

<input type="text" list="frutas" placeholder="Escribí una fruta...">

<datalist id="frutas">
    <option value="Manzana">
    <option value="Banana">
    <option value="Naranja">
    <option value="Pera">
    <option value="Durazno">
</datalist>

</body>
</html>
