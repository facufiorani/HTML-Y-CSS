<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Tablas</title>
</head>
<body>

        <thead>
            <tr>
                <th>Titulo 1</th>

        <tr>

            <td>Dato 3 Fila 1</td>
        </tr>
        <tr>
            <td>Dato 1 Fila 2</td>
            <td>Dato 2 Fila 2</td>
            <td>Dato 3 Fila 2</td>
        </tr>
        <tr>
            <td>Dato 1 Fila 2</td>
            <td>Dato 2 Fila 2</td>
            <td>Dato 3 Fila 2</td>
        </tr>
        <tr>
            <th class="total">TOTAL</th>
            <td colspan="2" class="total">100.000$</td>
        </tr>
        </tbody>
    </table>
</body>
</html>
